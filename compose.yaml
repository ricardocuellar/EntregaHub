services:
  db:
    container_name: dev_entregahub_db
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Crear .env}
      POSTGRES_USER: ${POSTGRES_USER:?Crear .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crear .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    container_name: dev_entregahub_backend
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    working_dir: /app
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
  frontend:
    container_name: dev_entregahub_frontend
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5174}:5174'
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
volumes:
  pgdata:
  frontend_modules:
